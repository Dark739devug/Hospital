spring.application.name=hospital

# Variables locales desde hospital/.env (opcional: en Render/Docker no existe y se usan las del entorno).
spring.config.import=optional:file:.env[.properties]

# Puerto: Render (y otros proveedores) lo asignan con la variable PORT.
server.port=${PORT:8080}
# Detrás de un proxy HTTPS (Render) respeta X-Forwarded-* para que Swagger use https.
server.forward-headers-strategy=framework

# URL JDBC completa en DB_URL, o por partes con DB_HOST, DB_PORT y DB_NAME (útil en Render).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Hospital}}
spring.datasource.username=${DB_USER:postgres}
# La contraseña de la base de datos NO tiene valor por defecto: definir la variable DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# La sesion de Hibernate se cierra al terminar cada service (todos son @Transactional).
spring.jpa.open-in-view=false

# El secreto del token NO tiene valor por defecto: definir JWT_SECRET (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Credenciales del administrador inicial (DataInitializer). Solo se usan la primera vez, cuando el
# usuario todavia no existe. ADMIN_PASSWORD NO tiene valor por defecto: hay que definirla.
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD}

# Facturacion: tasa de IVA aplicada por el servidor sobre el subtotal de la factura (0.12 = 12 %).
# El subtotal sale solo de las lineas del detalle; el cliente no puede fijar subtotal, IVA ni total.
app.facturacion.iva=${FACTURACION_IVA:0.12}

# Logging (SLF4J + Logback de Spring Boot). Niveles configurables por variable de entorno.
# LOG_LEVEL_APP=DEBUG muestra también los rechazos esperados (404, 400 de validación, token expirado).
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.hospital=${LOG_LEVEL_APP:INFO}
# %X{usuario}: usuario autenticado de la petición (lo coloca JwtAuthenticationFilter en el MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{usuario:-anónimo}] %-40.40logger{39} : %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{usuario:-anónimo}] %logger : %m%n%wEx
# Archivo con rotación diaria / por tamaño; se conservan 30 días
logging.file.name=${LOG_FILE:logs/hospital.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
